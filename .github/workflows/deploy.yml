name: Deploy Backend (CI/CD)

# Tout push sur main part en PRODUCTION (148.113.149.10) si les tests passent.
# Mise en place côté serveur : deploy/vps/update.sh (sauvegarde, santé, retour arrière).
on:
  push:
    branches:
      - main
      - prod-aziz
    
  workflow_dispatch:

# Jamais deux déploiements en même temps ; un déploiement commencé va jusqu'au bout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name:  Tests Backend
    runs-on: ubuntu-latest

    # Service PostgreSQL requis par la suite de tests (adresse par défaut de tests/conftest.py)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caisse_user
          POSTGRES_PASSWORD: caisse_pass
          POSTGRES_DB: caisse_test
        ports:
          - 5441:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name:  Récupérer le code
        uses: actions/checkout@v4

      - name:  Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name:  Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"

      - name:  Lancer tous les tests (unitaires, intégration, e2e)
        working-directory: apps/api
        run: |
          pytest -q

  deploy:
    name:  Déploiement VPS
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name:  Récupérer le code
        uses: actions/checkout@v4

      - name:  Déposer le code et le mettre en service
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_USER: ${{ secrets.VPS_USER }}
        run: |
          # Nettoyage automatique de l'IP (supprime espaces, retours à la ligne ou :port)
          HOST=$(echo "$RAW_HOST" | sed 's/:.*//' | tr -d '[:space:]')
          USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          SUDO=""; [ "$USER" = root ] || SUDO="sudo"
          ROOT=/opt/Departement_Bi/OsisPos_Backend

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new $USER@$HOST"

          # Code dans code.new : la version en service n'est pas touchée avant la bascule
          echo "${GITHUB_SHA::7}" > VERSION
          $SSH "$SUDO rm -rf $ROOT/code.new && $SUDO mkdir -p $ROOT/code.new"
          tar -czf - --exclude='.git' --exclude='__pycache__' --exclude='.venv' . \
            | $SSH "$SUDO tar -xzf - --no-same-owner -C $ROOT/code.new"

          # Sauvegarde, image, bascule, santé (retour arrière sinon), Nginx, sauvegarde nocturne
          $SSH "$SUDO bash $ROOT/code.new/deploy/vps/update.sh"
