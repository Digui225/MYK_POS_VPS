name: Deploy Backend (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Tests Backend
    runs-on: ubuntu-latest

    # Service PostgreSQL requis par la suite de tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caisse_user
          POSTGRES_PASSWORD: caisse_pass
          POSTGRES_DB: caisse_test
        ports:
          - 5441:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"

      - name: 🧪 Lancer les tests unitaires
        run: |
          pytest apps/api/tests/unit -q

  deploy:
    name: 🚀 Déploiement VPS
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🚀 Déployer sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_USER: ${{ secrets.VPS_USER }}
        run: |
          # Nettoyage automatique de l'IP (supprime espaces, retours à la ligne ou :port)
          HOST=$(echo "$RAW_HOST" | sed 's/:.*//' | tr -d '[:space:]')
          USER=$(echo "$RAW_USER" | tr -d '[:space:]')

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          # Envoyer le code source compressé vers le VPS
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "$USER@$HOST" "mkdir -p /opt/Departement_Bi/OsisPos_Backend/code"
          tar -czf - --exclude='.git' --exclude='__pycache__' --exclude='.venv' . | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "$USER@$HOST" "tar -xzf - -C /opt/Departement_Bi/OsisPos_Backend/code"

          # Démarrer Docker Compose et exécuter les migrations
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "$USER@$HOST" "bash -s" << 'EOF'
            set -e
            export CAISSE_ROOT=/opt/Departement_Bi/OsisPos_Backend
            cd /opt/Departement_Bi/OsisPos_Backend/code/deploy/vps

            # Rebuild et relance des conteneurs
            docker compose -f docker-compose.yml up -d --build

            # Attendre que les conteneurs soient prêts
            echo "Attente du démarrage de l'API..."
            sleep 5

            # Appliquer les migrations de la base
            docker compose -f docker-compose.yml exec -T caisse-api alembic upgrade head

            # Initialiser les données si la base est encore vide (seed démo)
            docker compose -f docker-compose.yml exec -T caisse-api python -m caisse.cli seed --demo || true
          EOF
