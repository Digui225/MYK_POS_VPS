# Projet caisse — rejoint le socle PostgreSQL partagé (../infra, réseau infra_shared).
# Le service `web` (nginx + build React) arrivera avec le frontend ; `backup` avec un lot
# ultérieur. Renvoi automatique FNE : `python -m caisse.cli fne-worker` (service
# `caisse-fne-worker` de deploy/vps/docker-compose.yml).
services:
  api:
    build:
      context: .
      target: runtime
    restart: always
    env_file: .env
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [infra_shared]

networks:
  infra_shared:
    external: true
