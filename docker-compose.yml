# Projet caisse — rejoint le socle PostgreSQL partagé (../infra, réseau infra_shared).
# Le service `web` (nginx + build React) arrivera avec le frontend ;
# `worker` (renvoi automatique FNE/impression, aujourd'hui manuel via /fne/documents/{id}/retry
# et /printing/jobs/{id}/retry) et `backup` avec un lot ultérieur.
services:
  api:
    build:
      context: .
      target: runtime
    restart: always
    env_file: .env
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [infra_shared]

networks:
  infra_shared:
    external: true
