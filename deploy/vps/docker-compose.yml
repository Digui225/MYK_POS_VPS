# OsisPos — production sur le VPS 148.113.149.10 (caisse.osispos.com). Guide : deploy/vps/README.md
# Ports sur 127.0.0.1 seulement : Docker contourne ufw, un port publié sur 0.0.0.0 serait ouvert à Internet.
# Les secrets restent hors du dépôt, dans $CAISSE_ROOT (db.env, api.env), et survivent aux mises à jour du code.
# Mise en place par deploy/vps/update.sh ; à la main :
#   cd /opt/Departement_Bi/OsisPos_Backend/code/deploy/vps && docker compose up -d
name: caisse

services:
  caisse-db:
    image: postgres:16-alpine
    container_name: caisse-db
    restart: always
    env_file: ${CAISSE_ROOT:-/opt/Departement_Bi/OsisPos_Backend}/db.env        # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: caisse
      POSTGRES_DB: caisse
      TZ: Africa/Abidjan
    # aucun port publié : l'API passe par caisse_net ; pgAdmin par un tunnel SSH vers l'IP du conteneur
    volumes:
      - caisse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caisse -d caisse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [caisse_net]

  caisse-api:
    build:
      context: ../../apps/api
      target: runtime
    image: caisse-api:latest
    container_name: caisse-api
    restart: always
    env_file: ${CAISSE_ROOT:-/opt/Departement_Bi/OsisPos_Backend}/api.env       # DATABASE_URL, JWT_SECRET, CORS_ORIGINS…
    environment:
      # Nginx est devant : faire confiance à X-Forwarded-For pour la vraie IP du client (sans quoi
      # la limite de connexions par IP serait partagée par tous). Sans risque : 8011 n'est
      # joignable que depuis la machine.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      caisse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8011:8001"           # joignable par Nginx seulement
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [caisse_net]

  # Renvoi automatique des FNE en file (FNE injoignable, 502/503, 401) ; jamais les incertaines.
  # Même image que l'API (reconstruite par update.sh) ; inactif si FNE_PROVIDER=manual.
  caisse-fne-worker:
    image: caisse-api:latest
    pull_policy: never                  # image construite par le service caisse-api, jamais téléchargée
    container_name: caisse-fne-worker
    restart: always
    env_file: ${CAISSE_ROOT:-/opt/Departement_Bi/OsisPos_Backend}/api.env
    entrypoint: ["python", "-m", "caisse.cli", "fne-worker"]
    command: []
    depends_on:
      caisse-db:
        condition: service_healthy
    networks: [caisse_net]

volumes:
  caisse_pgdata:
    name: caisse_pgdata

networks:
  caisse_net:
    name: caisse_net
