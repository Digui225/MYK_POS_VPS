# OsisPos — accès par l'IP, port 8083 : celui de l'agent d'impression et des postes tant qu'ils
# ne sont pas passés sur https://caisse.osispos.com. À retirer ensuite (et fermer 8083 dans ufw).
server {
    listen 8083 default_server;
    server_name _;

    access_log /var/log/nginx/osispos_access.log;
    error_log  /var/log/nginx/osispos_error.log;

    include /etc/nginx/snippets/osispos-locations.conf;
}
