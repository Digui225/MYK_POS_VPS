# OsisPos — caisse.osispos.com en HTTP, AVANT l'obtention du certificat.
# update.sh l'installe tant que /etc/letsencrypt/live/caisse.osispos.com n'existe pas, puis le
# remplace par osispos-domain-https.conf. Sert l'appli et le défi Let's Encrypt (webroot).
server {
    listen 80;
    listen [::]:80;
    server_name caisse.osispos.com;

    access_log /var/log/nginx/osispos_access.log;
    error_log  /var/log/nginx/osispos_error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/osispos-locations.conf;
}
