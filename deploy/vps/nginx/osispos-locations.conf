# OsisPos — front (build statique) + relais de l'API, commun à tous les accès (8083, domaine).
# Installé dans /etc/nginx/snippets/ par deploy/vps/update.sh ; inclus par les fichiers server.

root /opt/Departement_Bi/OsisPos_Frontend/dist;
index index.html;

client_max_body_size 10m;

# Temps réel. Le jeton d'accès passe dans l'URL (?token=…) : hors du journal d'accès.
location /api/v1/ws {
    access_log off;
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location /api/ {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Interrogation de l'agent d'impression toutes les 2 s : hors journal d'accès (~43 000 lignes/jour)
location = /api/v1/print-agent/poll {
    access_log off;
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Swagger, OpenAPI et santé (servis à la racine par l'API)
location ~ ^/(docs|redoc|openapi\.json|health) {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Jamais en cache : un nouveau build est pris immédiatement. sw.js, registerSW.js et le manifeste
# comptent autant qu'index.html : un service worker resté en cache garde l'ancien front.
# (Un add_header ici annule ceux du bloc server : HSTS est donc répété ; ignoré en HTTP.)
location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=15768000" always;
    try_files $uri =404;
}

# Fichiers du build (noms avec empreinte) : cache long
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=15768000" always;
    try_files $uri =404;
}

# Routage côté client (SPA)
location / {
    try_files $uri $uri/ /index.html;
}
