# OsisPos — https://gestion.osispos.com (certificat Let's Encrypt, renouvelé par certbot.timer).
# Installé par update.sh dès que le certificat existe (setup-server.sh l'obtient).
server {
    listen 80;
    listen [::]:80;
    server_name gestion.osispos.com;

    # Renouvellement du certificat : reste en HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gestion.osispos.com;

    ssl_certificate     /etc/letsencrypt/live/gestion.osispos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestion.osispos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:osispos_ssl:10m;
    ssl_session_timeout 1d;

    # Le navigateur ne revient plus jamais en HTTP sur ce nom (6 mois)
    add_header Strict-Transport-Security "max-age=15768000" always;

    access_log /var/log/nginx/osispos_access.log;
    error_log  /var/log/nginx/osispos_error.log;

    include /etc/nginx/snippets/osispos-locations.conf;
}
