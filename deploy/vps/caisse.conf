server {
    listen 8083 default_server;
    server_name _;

    root /opt/Departement_Bi/OsisPos_Frontend/dist;
    index index.html;

    client_max_body_size 10m;

    access_log /var/log/nginx/osispos_access.log;
    error_log  /var/log/nginx/osispos_error.log;

    # Relais WebSocket temps réel (synchronisation des commandes et sessions)
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Relais vers l'API FastAPI (sur le port 8011 du conteneur)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Agent d'impression
    location = /api/v1/print-agent/poll {
        access_log off;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / OpenAPI et santé
    location ~ ^/(docs|redoc|openapi\.json|health) {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pas de cache pour index.html (pour voir les mises à jour immédiatement)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache long pour les assets Vite (images, js, css hashés)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routage SPA React (toutes les routes renvoient vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
