# Caisse MYK — front (build statique) + relais de l'API sur le même port.
# Copié dans /etc/nginx/conf.d/caisse.conf, puis : nginx -t && systemctl reload nginx
server {
    listen 8083;
    server_name 162.215.172.50 _;

    root /opt/caisse/front-dist;
    index index.html;

    client_max_body_size 2m;   # aligné sur MAX_REQUEST_BODY_BYTES de l'API

    access_log /var/log/nginx/caisse_access.log;
    error_log  /var/log/nginx/caisse_error.log;

    # API : /api/v1/... relayé tel quel (pas de « / » final après le port)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Interrogation de l'agent d'impression toutes les 2 s : hors journal d'accès (~43 000 lignes/jour)
    location = /api/v1/print-agent/poll {
        access_log off;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger, OpenAPI et santé (servis à la racine par l'API)
    location ~ ^/(docs|redoc|openapi\.json|health) {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html jamais en cache : un nouveau build est pris immédiatement
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers du build (noms avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routage côté client (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
