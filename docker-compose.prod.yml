services:
  db:
    image: postgres:16-alpine
    container_name: caisse-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-postgres_super_secret_changeme}
      POSTGRES_DB: postgres
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD:-hotel_secret_changeme}
      CAISSE_DB_PASSWORD: ${CAISSE_DB_PASSWORD:-caisse_secret_changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - caisse_pgdata:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caisse_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: caisse-api
    restart: always
    environment:
      APP_NAME: "OsisPos API"
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://caisse:${CAISSE_DB_PASSWORD:-caisse_secret_changeme}@db:5432/caisse
      JWT_SECRET: ${JWT_SECRET:-changer_cette_cle_par_une_chaine_aleatoire_de_plus_de_64_caracteres_12345}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TZ: ${TZ:-Africa/Abidjan}
      PRINT_AGENT_URL: ${PRINT_AGENT_URL:-http://localhost:8090}
      FNE_PROVIDER: ${FNE_PROVIDER:-manual}
      FNE_API_BASE_URL: ${FNE_API_BASE_URL:-http://54.247.95.108/ws}
      FNE_API_KEY: ${FNE_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - caisse_net

  web:
    build:
      context: ../Caisse_MYK_frontend
      dockerfile: Dockerfile
    container_name: caisse-web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - caisse_net

volumes:
  caisse_pgdata:

networks:
  caisse_net:
    driver: bridge
